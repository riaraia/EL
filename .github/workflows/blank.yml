<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El</title>
    <style>
        body {
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .letter-container {
            background-color: #fff8eb;
            border: 3px solid #c89696;
            border-radius: 20px;
            padding: 20px;
            width: 500px;
            opacity: 0;
            animation: fadeIn 3s forwards;
        }
        .message {
            color: #463232;
            font-size: 14px;
            white-space: pre-line;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="letter-container">
        <p class="message">
            My el,

            Hi baby ko! Why sad ang wife ko? :( ano pwede ko
            gawin para happy na ulit baby ko, halika na here
            kiss naa hehehe malapit na tayo mag anniversary and super 
            excited na me kung alam mo lang, wifey I know hindi u
            okay ngayon and nassad ako na hindi man lang kita 
            ma hug agad-agad everytime na hindi ka okay. Nandito lang
            ako palagi for you ha, kung pwede lang makuha 'yang bigat 
            na naffeel mo or maipasa eh kinuha ko na. Pag nagkita tayo i'll
            make sure na masaya ka araw-araw hehehe

            I love you always n forever my love!

            Your future wife,
            Ali
        </p>
    </div>
</body>
</html>
